name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=${JAVA_HOME}"
          
          if [ -z "${JAVA_HOME}" ] || [ ! -d "${JAVA_HOME}" ]; then
            echo "::error::JAVA_HOME is not properly configured."
            exit 1
          fi
          
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect active Java major version."
            exit 1
          fi
          
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java version must be 17 or newer. Found version: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Searching in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file exists but is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi
          
          echo "APK verified successfully:"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$ASSET_DIR"
          
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_CLEAN=$(echo "$REPO_RAW" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="android-app"
          fi
          
          RUN_NUM="${GITHUB_RUN_NUMBER}"
          ASSET_FILENAME="${REPO_CLEAN}-debug-build-${RUN_NUM}.apk"
          DEST_APK="${ASSET_DIR}/${ASSET_FILENAME}"
          
          cp "$SRC_APK" "$DEST_APK"
          
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to prepare release asset at $DEST_APK"
            exit 1
          fi
          
          echo "Release asset prepared: $DEST_APK"
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset not found or empty at $ASSET_PATH"
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset must have .apk extension: $ASSET_PATH"
              exit 1
              ;;
          esac
          
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### 📱 Automated Debug APK Build
          
          This is an automatically generated debug APK built by GitHub Actions.
          
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA:** \`${GITHUB_SHA}\`
          - **Build Artifact:** \`${ASSET_NAME}\`
          
          > ⚠️ **Note:** This APK is intended for testing and review purposes only. It is signed with a temporary debug keystore and is not a Google Play Store production release.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${GITHUB_SHA}" \
            --latest
          
          echo "release_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.create_release.outcome }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================="
            echo "  GitHub Release Published Successfully!  "
            echo "=========================================="
            
            RELEASE_INFO=$(gh release view "$RELEASE_TAG" --json tagName,title,url)
            RELEASE_URL=$(echo "$RELEASE_INFO" | grep -o '"url":"[^"]*' | grep -o '[^"]*$')
            
            echo "Release Tag:   $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${GITHUB_RUN_NUMBER}"
            echo "Release URL:   $RELEASE_URL"
            echo "APK Asset:     $ASSET_NAME"
            
            echo "### 🚀 Debug APK Available for Download" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**GitHub Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the APK file (\`$ASSET_NAME\`) directly from the **Assets** section of the release page onto your Android device." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "*(The standard Actions artifact \`app-debug-apk\` is also preserved and available under the workflow run summary.)*" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=========================================="
            echo "  Warning: Release Publishing Encountered an Issue  "
            echo "=========================================="
            echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact."
            echo "Artifact Name: app-debug-apk"
            echo "Release publishing could not be completed, but the APK artifact is preserved."
            
            echo "### ⚠️ Debug APK Build Succeeded (Artifact Available)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was compiled successfully and is available as a GitHub Actions artifact named **\`app-debug-apk\`** at the bottom of this workflow run page." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release publishing did not complete, but no build outputs were lost." >> "$GITHUB_STEP_SUMMARY"
          fi
